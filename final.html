<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Victòria - EL GRAN ROBATORI AL MUSEU</title>
    <style>
        body {
            background-color: #0b0c16;
            background-image: url("images/background-museu.jpg"); /* Reaprofitem el fons */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* La caixa central on posem la felicitació */
        .contenidor-final {
            background-color: rgba(15, 52, 96, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 4px solid #f39c12;
            box-shadow: 0px 0px 30px rgba(243, 156, 18, 0.6);
            max-width: 600px;
        }

        h1 {
            color: #f39c12;
            font-size: 3em;
            margin-top: 0;
            text-shadow: 2px 2px 5px black;
        }

        /* La ranura de la foto que demanaves */
        .foto-lladre {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 4px solid #e94560;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0px 0px 15px rgba(233, 69, 96, 0.5);
            background-color: #1a1a2e; /* Color fosc per si la imatge triga a carregar */
        }

        p {
            font-size: 20px;
            line-height: 1.5;
        }

        /* Destaquem els diners que ha robat en verd */
        .diners {
            color: #2ecc71;
            font-size: 40px;
            font-weight: bold;
            display: block;
            margin: 15px 0;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        .boto-tornar {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .boto-tornar:hover {
            background-color: #f39c12;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="contenidor-final">
        <h1>VICTÒRIA!</h1>
        
        <!-- RANURA PER LA FOTO: Posa una imatge a la teva carpeta "images" i canvia el nom aquí si cal -->
        <img src="images/lladre-ric.png" alt="Lladre celebrant amb els bitllets" class="foto-lladre">
        
        <p>Felicitats, ets un gran lladre! Has superat tota la seguretat, has enganyat i esquivat als guàrdies i has pogut escapar per la teulada sense problemes!</p>
        
        <p>T'emportes un botí total de:</p>
        <!-- Aquest text canviarà automàticament amb JavaScript -->
        <span class="diners" id="textDiners">0€</span>

        <!-- Botó per tornar al menú que vas crear -->
        <button class="boto-tornar" onclick="window.location.href='inici.html'">Tornar al Menú Principal</button>
    </div>
</body>

<script>
    // LLegim l'enllaç de la pàgina web per buscar quants diners ens han passat (ex: final.html?diners=4500)
    var urlParams = new URLSearchParams(window.location.search);
    var dinersRobats = urlParams.get('diners');
        
    // Si ha arribat el número, el posem a la pantalla
    if(dinersRobats) {
        document.getElementById('textDiners').innerText = dinersRobats + "€";
    } else {
        document.getElementById('textDiners').innerText = "Botí incalculable!";
    }
</script>
</html>
